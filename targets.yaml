# sepang-watch 监测目标
#
# priority: high  => 变化即高优先级告警（开票相关核心页）
# keywords        => 出现即告警（开卖信号）
# negative_keywords => 现在有、将来消失 => 强烈开卖信号（如"即将开卖""敬请期待"）
#
# 提示：先用 --dry-run 跑一轮，看哪些页面被 Cloudflare 拦（403）。
# 被拦的页面交给 Claude Code 处理：让它打开开发者工具找出真实的 JSON 接口，
# 换成 mode: json 直接打接口，比爬 HTML 稳得多。

targets:
  # ─────────────── 核心：开票状态 ───────────────
  - id: bahraingp-home
    label: 巴林GP官网（价格泄露源头）
    url: https://www.bahraingp.com/
    priority: high
    keywords: ["buy now", "on sale", "purchase", "tickets available", "sepang", "malaysia"]
    negative_keywords: ["coming soon", "register your interest", "notify me"]

  - id: bahraingp-tickets
    label: 巴林GP官网 · 票务页
    # /tickets 是 JS 渲染的空壳（抓下来只有 235 字符），且 301 会降级到 http、
    # 常年 10s+ 超时。这个 blog 页才是有真内容的票务说明（grandstand/hillstand）。
    url: https://www.bahraingp.com/blog/events/ticket-information/
    priority: high
    keywords: ["buy", "add to cart", "grandstand", "hillstand", "select"]
    negative_keywords: ["coming soon", "sold out", "not yet"]

  - id: sepang-ticketing
    label: 雪邦赛道 · 票务页
    url: https://www.sepangcircuit.com/ticketing
    priority: high
    keywords: ["formula 1", "f1", "bahrain", "buy tickets", "october"]
    negative_keywords: ["coming soon"]

  - id: sepang-home
    label: 雪邦赛道 · 首页
    url: https://www.sepangcircuit.com/
    priority: high
    keywords: ["bahrain grand prix", "formula 1", "tickets on sale"]

  - id: ticket2u-search
    label: Ticket2U（马来西亚授权代理）
    url: https://www.ticket2u.com.my/
    priority: high
    keywords: ["formula 1", "f1", "bahrain", "sepang grand prix"]

  - id: f1-tickets-store
    label: F1 官方票务店
    url: https://tickets.formula1.com/en
    priority: high
    keywords: ["malaysia", "sepang", "bahrain grand prix"]

  # ─────────────── 核心：款待 / Paddock Club ───────────────
  - id: f1exp-sepang
    label: F1 Experiences · 雪邦站页面
    url: https://f1experiences.com/en/2026-bahrain-grand-prix
    priority: high
    keywords: ["on sale", "book now", "buy now", "packages available", "deposit programme now open"]
    negative_keywords: ["sign up to be notified", "register your interest", "coming soon"]

