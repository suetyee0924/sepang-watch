  # 开卖后把 url 换成实际的选座页面。
  - id: seating-probe
    label: 对号入座探针（开票后启用）
    url: https://tickets.formula1.com/en
    priority: normal
    keywords:
      - "select your seat"
      - "seat map"
      - "seating plan"
      - "reserved seating"
      - "numbered seat"
      - "unreserved"
      - "free seating"
      - "general admission"
      - "first come"

